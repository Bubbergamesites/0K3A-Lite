<button onclick="cloakSite()">Open in Stealth Mode</button>

<script>
function cloakSite() {
    // 1. Open a new blank window
    const win = window.open('about:blank', '_blank');

    if (!win) {
        alert("Pop-up blocked! Please allow pop-ups for this site to use Stealth Mode.");
        return;
    }

    // 2. Style the new window's body to be full-screen
    win.document.body.style.margin = '0';
    win.document.body.style.height = '100vh';
    win.document.body.style.overflow = 'hidden';

    // 3. Create an iframe that fills the entire blank page
    const iframe = win.document.createElement('iframe');
    
    // Set the iframe to the current site's URL
    iframe.src = "/graggle.html"; 
    
    // Style the iframe to be invisible and full-screen
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    
    // 4. Append the iframe to the new blank window
    win.document.body.appendChild(iframe);

    // 5. Optional: Redirect the original tab to a safe site like Google
    window.location.replace("https://classroom.google.com");
}
</script>
